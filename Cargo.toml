[package]
name = "vox-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
dotenv = "0.15.0"
futures-util = "0.3.34"
hex = "0.4"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "http2", "charset", "query", "stream", "form"] }
serde_urlencoded = "0.7.1"
subtle = "2"
tracing = "0.1.44"
tracing-subscriber = "0.3"
dashmap = { version = "6.2.1", features = ["serde"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }
async-trait = "0.1"
bytes = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
unicode-segmentation = "1.13"
minimp3 = { version = "0.6.1", features = ["async_tokio"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
