[package]
name = "vox-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
dotenv = "0.15.0"
futures-util = "0.3.34"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "http2", "charset"] }
