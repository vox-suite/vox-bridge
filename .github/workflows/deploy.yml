name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build ARM64 release
        run: cargo build --release --locked

      - name: Deploy to server
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy "$USER@$HOST" 'mkdir -p /home/admin/vox-bridge'
          scp -i ~/.ssh/deploy target/release/vox-bridge "$USER@$HOST:/home/admin/vox-bridge/vox-bridge.new"
          scp -i ~/.ssh/deploy ops/vox-bridge.service "$USER@$HOST:/tmp/vox-bridge.service"
          scp -i ~/.ssh/deploy ops/Caddyfile "$USER@$HOST:/tmp/Caddyfile.vox"
          ssh -i ~/.ssh/deploy "$USER@$HOST" \
            'set -eu; \
             chmod +x /home/admin/vox-bridge/vox-bridge.new; \
             mv /home/admin/vox-bridge/vox-bridge.new /home/admin/vox-bridge/vox-bridge; \
             sudo install -o root -g root -m 644 /tmp/vox-bridge.service /etc/systemd/system/vox-bridge.service; \
             sudo touch /etc/vox-bridge.env; \
             sudo chmod 600 /etc/vox-bridge.env; \
             caddy validate --config /tmp/Caddyfile.vox; \
             sudo install -o root -g root -m 644 /tmp/Caddyfile.vox /etc/caddy/Caddyfile; \
             sudo systemctl daemon-reload; \
             sudo systemctl enable vox-bridge; \
             sudo systemctl restart vox-bridge; \
             sudo systemctl reload caddy; \
             for attempt in 1 2 3 4 5; do \
               curl --fail --silent http://127.0.0.1:3000/health && exit 0; \
               sleep 2; \
             done; \
             sudo journalctl -u vox-bridge --no-pager -n 50; \
             exit 1'
