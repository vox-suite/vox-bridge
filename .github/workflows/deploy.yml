name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (static musl)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Deploy to server
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # atomic swap: upload beside the running binary, then mv (survives ETXTBSY)
          scp -i ~/.ssh/deploy target/x86_64-unknown-linux-musl/release/vox-bridge "$USER@$HOST:/home/opc/vox-bridge/vox-bridge.new"
          ssh -i ~/.ssh/deploy "$USER@$HOST" \
            'mv /home/opc/vox-bridge/vox-bridge.new /home/opc/vox-bridge/vox-bridge && \
             chmod +x /home/opc/vox-bridge/vox-bridge && \
             sudo chcon -t bin_t /home/opc/vox-bridge/vox-bridge && \
             sudo systemctl restart vox-bridge && \
             sleep 3 && systemctl is-active vox-bridge'
