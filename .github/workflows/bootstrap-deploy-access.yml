name: bootstrap-vox-deploy-access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VOX_DEPLOY_PUBLIC_KEY: ${{ secrets.VOX_DEPLOY_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          grep -Eq '^ssh-ed25519 [A-Za-z0-9+/]+={0,3}( .+)?$' <<<"$VOX_DEPLOY_PUBLIC_KEY"
          printf '%s\n' "$SSH_PRIVATE_KEY" > /tmp/bridge-deploy-key
          printf '%s\n' "$VOX_DEPLOY_PUBLIC_KEY" > /tmp/vox-deploy-public-key
          chmod 600 /tmp/bridge-deploy-key /tmp/vox-deploy-public-key

      - name: Authorize Vox Deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >>~/.ssh/known_hosts 2>/dev/null
          ssh -i /tmp/bridge-deploy-key "$SERVER_USER@$SERVER_HOST" \
            'set -eu; umask 077; mkdir -p ~/.ssh; touch ~/.ssh/authorized_keys; key=$(cat); grep -qxF "$key" ~/.ssh/authorized_keys || printf "%s\n" "$key" >>~/.ssh/authorized_keys; chmod 700 ~/.ssh; chmod 600 ~/.ssh/authorized_keys' \
            </tmp/vox-deploy-public-key

      - name: Remove credentials
        if: always()
        run: rm -f /tmp/bridge-deploy-key /tmp/vox-deploy-public-key
